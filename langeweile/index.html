<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Spielekiste</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2317153b'/><circle cx='34' cy='50' r='14' fill='%23ff6b6b'/><rect x='56' y='36' width='28' height='28' rx='6' fill='%23ffcf3f'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a bright toy box of small games
   IDEA a lacquered game box with eight painted compartments
   PICTURE each tile is a drawn scene of its game; inside a game the board itself fills the screen
   COLOUR night indigo ground, eight candy colours as flat tile fields, warm white ink
   TYPE Fredoka for titles and numbers + Nunito for text
   LAYOUT laptop: title row with surprise button, 4x2 tile grid; phone: title, 2x4 tiles; game view: one column board */
:root{color-scheme:dark;--bg:#17153b;--panel:#24215a;--panel2:#2f2b70;--line:#3b3685;--ink:#fff8ec;--muted:#c3bdf0;--dark:#17153b;--coral:#ff6b6b;--sun:#ffcf3f;--mint:#3ddc97;--pink:#ff8fc7;--orange:#ff9f45;--violet:#b79cff;--sky:#5fb2ff;--lime:#b5e655}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh;padding-block:clamp(20px,3vw,40px) 48px;padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,.fd{font-family:Fredoka,Nunito,sans-serif;letter-spacing:-.02em;line-height:1.05;margin:0}
h1{font-size:clamp(36px,6vw,52px);font-weight:700}
h2{font-size:clamp(26px,4vw,34px);font-weight:600}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.top p{margin:8px 0 0;color:var(--muted);max-width:46ch}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{background:var(--sun);color:var(--dark);border:0;border-radius:14px;padding:12px 20px;font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;min-height:48px;box-shadow:0 4px 0 #c99a12;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c99a12}
.btn:focus-visible,.tile:focus-visible,.ghost:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #120f33}
.ghost{background:none;border:2px solid var(--line);border-radius:12px;padding:8px 14px;min-height:44px;color:var(--ink);font-weight:700}
.ghost:hover{border-color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.tile{display:flex;flex-direction:column;text-align:left;border:0;border-radius:22px;padding:0;overflow:hidden;color:var(--dark);background:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 55%,#000);transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 55%,#000)}
.tile svg{display:block;width:100%;height:auto;aspect-ratio:16/10;background:color-mix(in srgb,var(--c) 82%,#fff)}
.tile .tx{padding:12px 14px 14px}
.tile b{display:block;font-family:Fredoka,sans-serif;font-weight:600;font-size:21px;line-height:1.1}
.tile span{display:block;font-size:14px;font-weight:700;opacity:.8;margin-top:2px}
.tile small{display:inline-block;margin-top:8px;font-size:13px;font-weight:800;background:rgba(23,21,59,.12);border-radius:99px;padding:2px 10px}
.foot{color:var(--muted);font-size:14px;margin-top:28px}
.gbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 16px;margin-bottom:18px}
.gbar h2{order:3;flex:1 0 100%}
.rec{font-size:14px;font-weight:800;color:var(--dark);background:var(--c);border-radius:99px;padding:4px 12px;white-space:nowrap}
.stage{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.status{font-family:Fredoka,sans-serif;font-size:24px;font-weight:600;text-align:center;margin:0;min-height:1.3em}
.sub{text-align:center;color:var(--muted);margin:0;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.seg{display:inline-flex;background:var(--panel);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:8px 14px;min-height:40px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--ink)}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.tally div{background:var(--panel);border-radius:14px;padding:8px}
.tally b{display:block;font-family:Fredoka,sans-serif;font-size:28px;line-height:1.1}
.tally span{font-size:13px;color:var(--muted);font-weight:700}
.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--panel);padding:10px;border-radius:22px}
.ttt button{aspect-ratio:1;border:0;border-radius:14px;background:var(--panel2);font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(44px,14vw,76px);line-height:1}
.ttt button.x{color:var(--coral)}.ttt button.o{color:var(--sun)}
.ttt button.win{background:var(--ink)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.card{aspect-ratio:3/4;border:0;border-radius:14px;position:relative;background:none;padding:0;perspective:600px}
.card i{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;transition:transform .35s;font-style:normal}
.card .bk{background:var(--sun) radial-gradient(circle at 50% 50%,#ffe17a 0 18%,transparent 19%) 0 0/22px 22px}
.card .fr{background:var(--ink);transform:rotateY(180deg);font-size:clamp(28px,9vw,44px)}
.card.up .bk{transform:rotateY(180deg)}.card.up .fr{transform:rotateY(360deg)}
.card.done .fr{background:var(--mint)}
.snk{position:relative;align-self:center;border-radius:18px;overflow:hidden;touch-action:none;background:#1d1a4a}
.snk canvas{display:block}
.over{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;background:rgba(23,21,59,.62);text-align:center;padding:16px}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center}
.pad button{border:0;border-radius:14px;background:var(--panel2);font-size:22px;font-weight:800}
.pad button:active{background:var(--mint);color:var(--dark)}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.track{position:relative;height:56px;background:var(--panel);border-radius:14px;overflow:hidden}
.track .rng{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--pink) 35%,transparent);border-left:3px solid var(--pink);border-right:3px solid var(--pink);transition:left .3s,width .3s}
.track .tk{position:absolute;top:10px;bottom:10px;width:3px;background:var(--muted);border-radius:2px}
.track .lab{position:absolute;bottom:4px;font-size:13px;font-weight:800;color:var(--muted)}
form.guess{display:flex;gap:10px}
form.guess input{flex:1;font:600 24px Fredoka,sans-serif;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:8px 14px;min-height:56px;width:100%}
form.guess input:focus{outline:none;border-color:var(--pink)}
.hist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:32px}
.hist span{background:var(--panel);border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.react{border:0;border-radius:26px;min-height:min(56vh,380px);display:grid;place-items:center;align-content:center;gap:6px;padding:20px;text-align:center;background:var(--panel2);user-select:none;touch-action:manipulation}
.react b{font-family:Fredoka,sans-serif;font-size:clamp(34px,8vw,52px);line-height:1.05}
.react span{font-weight:700;font-size:17px}
.react.wait{background:var(--coral);color:var(--dark)}
.react.go{background:var(--mint);color:var(--dark)}
.react.res{background:var(--orange);color:var(--dark)}
.ssp-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ssp-pick button{border:0;border-radius:18px;background:var(--violet);color:var(--dark);padding:10px 6px 12px;font-weight:800;box-shadow:0 5px 0 #7c62c9}
.ssp-pick button:active{transform:translateY(3px);box-shadow:0 2px 0 #7c62c9}
.ssp-pick svg{width:100%;height:auto;max-height:90px;display:block}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;background:var(--panel);border-radius:22px;padding:14px;text-align:center}
.duel svg{width:100%;max-width:130px;height:auto;margin:0 auto;display:block}
.duel .vs{font-family:Fredoka,sans-serif;font-size:22px;color:var(--muted)}
.duel small{display:block;font-weight:800;color:var(--muted)}
.simon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(100%,420px);align-self:center;aspect-ratio:1}
.simon button{border:0;border-radius:24px;background:var(--c);opacity:.42;transition:opacity .08s,transform .08s}
.simon button.lit{opacity:1;transform:scale(.97);box-shadow:0 0 32px var(--c)}
.simon button:nth-child(1){border-top-left-radius:50%}.simon button:nth-child(2){border-top-right-radius:50%}.simon button:nth-child(3){border-bottom-left-radius:50%}.simon button:nth-child(4){border-bottom-right-radius:50%}
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--lime);border-radius:26px;padding:14px}
.hole{aspect-ratio:1;border:0;padding:0;background:none;position:relative;overflow:hidden;touch-action:manipulation}
.hole svg{position:absolute;inset:0;width:100%;height:100%}
.hole .mole{transform:translateY(66px);transition:transform .12s}
.hole.up .mole{transform:translateY(0)}
.hole.hit .mole{transform:translateY(22px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section id="hub">
    <div class="top">
      <div>
        <h1>Spielekiste</h1>
        <p>Acht kleine Spiele gegen Langeweile. Keine Anmeldung, keine Werbung. Deine Rekorde bleiben auf diesem Gerät.</p>
      </div>
      <button class="btn" id="random">Überrasch mich</button>
    </div>
    <div class="grid" id="tiles"></div>
    <p class="foot">Tipp: Snake lässt sich mit den Pfeiltasten, durch Wischen oder mit dem Steuerkreuz spielen.</p>
  </section>
  <section id="game" hidden>
    <div class="gbar">
      <button class="ghost" id="back">← Alle Spiele</button>
      <h2 id="gtitle"></h2>
      <span class="rec" id="grec"></span>
    </div>
    <div class="stage" id="stage"></div>
  </section>
</div>
<script>
{
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = n => Math.floor(Math.random() * n);
const D = '#17153b', W = '#fff8ec';

// ---------- Speicher (fällt auf Arbeitsspeicher zurück) ----------
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem('spk.' + k); if (v != null) return JSON.parse(v); } catch (e) {} return mem[k] ?? null; },
  set(k, v) { mem[k] = v; try { localStorage.setItem('spk.' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- Töne ----------
let ac;
function tone(f, d = 0.2) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

// ---------- Bilder ----------
const ART = {
  ttt: `<path d="M68 18v72M92 18v72M44 42h72M44 66h72" stroke="${D}" stroke-width="5" stroke-linecap="round"/><path d="M50 24l12 12M62 24l-12 12M98 72l12 12M110 72l-12 12" stroke="${W}" stroke-width="6" stroke-linecap="round"/><circle cx="80" cy="54" r="7" fill="none" stroke="${D}" stroke-width="5"/><circle cx="56" cy="78" r="7" fill="none" stroke="${D}" stroke-width="5"/><circle cx="104" cy="30" r="7" fill="none" stroke="${D}" stroke-width="5"/>`,
  memory: `<g transform="rotate(-12 48 56)"><rect x="28" y="26" width="40" height="56" rx="7" fill="${D}"/><circle cx="48" cy="54" r="8" fill="none" stroke="#ffcf3f" stroke-width="3"/></g><rect x="60" y="20" width="40" height="58" rx="7" fill="${W}" stroke="${D}" stroke-width="3"/><polygon points="80,34 84,44 95,44 86,51 89,62 80,55 71,62 74,51 65,44 76,44" fill="#ff6b6b"/><g transform="rotate(12 112 56)"><rect x="92" y="26" width="40" height="56" rx="7" fill="${D}"/><circle cx="112" cy="54" r="8" fill="none" stroke="#ffcf3f" stroke-width="3"/></g>`,
  snake: `<path d="M18 74 C40 74 40 42 62 42 S84 74 106 74 S122 46 128 40" stroke="${D}" stroke-width="13" fill="none" stroke-linecap="round"/><circle cx="130" cy="38" r="10" fill="${D}"/><circle cx="133" cy="35" r="3" fill="${W}"/><circle cx="44" cy="26" r="9" fill="#ff6b6b"/><path d="M44 17c3-5 8-6 10-5-2 4-6 6-10 5z" fill="${D}"/>`,
  zahl: `<text x="44" y="82" font-size="76" font-family="Fredoka,sans-serif" font-weight="700" fill="${D}">?</text><rect x="86" y="30" width="46" height="34" rx="9" fill="${W}"/><text x="109" y="56" text-anchor="middle" font-size="24" font-family="Fredoka,sans-serif" font-weight="700" fill="${D}">42</text><path d="M109 22l-6-8h12zM109 72l-6 8h12z" fill="${D}"/>`,
  reaktion: `<rect x="73" y="12" width="14" height="10" rx="3" fill="${D}"/><circle cx="80" cy="56" r="32" fill="${W}" stroke="${D}" stroke-width="6"/><path d="M80 56L96 40" stroke="${D}" stroke-width="5" stroke-linecap="round"/><circle cx="80" cy="56" r="4" fill="${D}"/><polygon points="126,26 112,54 122,54 114,80 136,46 125,46 132,26" fill="${D}"/>`,
  ssp: `<path d="M26 58c0-14 10-22 22-22s20 8 20 20-8 22-22 22c-12 0-20-8-20-20z" fill="${D}"/><rect x="72" y="28" width="30" height="44" rx="4" fill="${W}" stroke="${D}" stroke-width="3" transform="rotate(6 87 50)"/><path d="M79 40h16M79 48h16M79 56h12" stroke="${D}" stroke-width="2.5" transform="rotate(6 87 50)"/><path d="M118 66L112 26M130 66L138 26" stroke="${D}" stroke-width="5" stroke-linecap="round"/><circle cx="116" cy="72" r="7" fill="none" stroke="${D}" stroke-width="4"/><circle cx="132" cy="72" r="7" fill="none" stroke="${D}" stroke-width="4"/>`,
  farbe: `<path d="M77 49V17a32 32 0 0 0-32 32z" fill="#ff6b6b"/><path d="M83 49V17a32 32 0 0 1 32 32z" fill="#ffcf3f"/><path d="M77 55H45a32 32 0 0 0 32 32z" fill="#3ddc97"/><path d="M83 55h32a32 32 0 0 1-32 32z" fill="#b79cff"/><circle cx="80" cy="52" r="10" fill="${D}"/>`,
  maulwurf: `<ellipse cx="80" cy="84" rx="42" ry="10" fill="${D}"/><path d="M54 84V58a26 26 0 0 1 52 0v26z" fill="#8a5a3c"/><circle cx="71" cy="56" r="3.5" fill="${D}"/><circle cx="89" cy="56" r="3.5" fill="${D}"/><ellipse cx="80" cy="66" rx="7" ry="5" fill="#ff8fc7"/><path d="M38 84a42 10 0 0 0 84 0z" fill="${D}"/>`
};
const svg = (k, vb = '0 0 160 100') => `<svg viewBox="${vb}" aria-hidden="true">${ART[k]}</svg>`;

// ---------- Spiele ----------
const GAMES = [
  { id: 'ttt', name: 'Drei gewinnt', desc: 'X und O auf neun Feldern', c: '--coral', better: 'high', fmt: v => `${v} ${v === 1 ? 'Sieg' : 'Siege'} gg. Computer`, mount: mountTTT },
  { id: 'memory', name: 'Memory', desc: 'Finde alle acht Paare', c: '--sun', better: 'low', fmt: v => `${v} Züge`, mount: mountMemory },
  { id: 'snake', name: 'Schlange', desc: 'Fressen, wachsen, nicht anstoßen', c: '--mint', better: 'high', fmt: v => `${v} Äpfel`, mount: mountSnake },
  { id: 'zahl', name: 'Zahlenraten', desc: 'Welche Zahl von 1 bis 100?', c: '--pink', better: 'low', fmt: v => `${v} Versuche`, mount: mountZahl },
  { id: 'reaktion', name: 'Reaktionstest', desc: 'Wie schnell bist du?', c: '--orange', better: 'low', fmt: v => `${v} ms`, mount: mountReaktion },
  { id: 'ssp', name: 'Schere, Stein, Papier', desc: 'Gegen den Computer', c: '--violet', better: 'high', fmt: v => `${v}er-Serie`, mount: mountSSP },
  { id: 'farbe', name: 'Farbfolge', desc: 'Merk dir die Reihenfolge', c: '--sky', better: 'high', fmt: v => `Stufe ${v}`, mount: mountFarbe },
  { id: 'maulwurf', name: 'Maulwurf hauen', desc: '30 Sekunden, so viele wie geht', c: '--lime', better: 'high', fmt: v => `${v} Treffer`, mount: mountMaulwurf }
];
const byId = Object.fromEntries(GAMES.map(g => [g.id, g]));

const getRec = g => store.get('rec.' + g.id);
function offer(id, v) {
  const g = byId[id], old = getRec(g);
  const better = old == null || (g.better === 'low' ? v < old : v > old);
  if (better) { store.set('rec.' + id, v); showRec(g); }
  return better;
}
function showRec(g) { const r = getRec(g); $('#grec').textContent = r == null ? 'Noch kein Rekord' : 'Rekord: ' + g.fmt(r); }

function renderTiles() {
  $('#tiles').innerHTML = GAMES.map(g => {
    const r = getRec(g);
    return `<button class="tile" style="--c:var(${g.c})" data-id="${g.id}">${svg(g.id)}<div class="tx"><b>${g.name}</b><span>${g.desc}</span><small>${r == null ? 'Noch kein Rekord' : 'Rekord: ' + g.fmt(r)}</small></div></button>`;
  }).join('');
}

// ---------- Navigation ----------
let cleanup = null, keyHandler = null, current = '';
function show(id) {
  if (cleanup) { cleanup(); cleanup = null; }
  keyHandler = null;
  const g = byId[id];
  current = g ? id : '';
  $('#hub').hidden = !!g; $('#game').hidden = !g;
  if (!g) { renderTiles(); return; }
  $('#game').style.setProperty('--c', `var(${g.c})`);
  $('#gtitle').textContent = g.name;
  showRec(g);
  const st = $('#stage'); st.innerHTML = '';
  cleanup = g.mount(st) || null;
  window.scrollTo(0, 0);
}
const route = () => show(location.hash.slice(1));
window.addEventListener('hashchange', route);
$('#tiles').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) location.hash = t.dataset.id; });
$('#back').addEventListener('click', () => { location.hash = ''; });
$('#random').addEventListener('click', () => {
  const pool = GAMES.filter(g => g.id !== store.get('last'));
  const g = pool[rnd(pool.length)]; store.set('last', g.id); location.hash = g.id;
});
document.addEventListener('keydown', e => { if (keyHandler) keyHandler(e); });

// ---------- Drei gewinnt ----------
function mountTTT(st) {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let b, turn, over, mode = 'cpu', score = { X: 0, O: 0, U: 0 }, starter = 'X', timer;
  st.innerHTML = `<div class="row"><div class="seg" id="tm"><button data-m="cpu" class="on">Gegen Computer</button><button data-m="2p">Zu zweit</button></div></div>
    <p class="status" id="ts" aria-live="polite"></p>
    <div class="ttt" id="tb">${Array.from({ length: 9 }, (_, i) => `<button data-i="${i}" aria-label="Feld ${i + 1}"></button>`).join('')}</div>
    <div class="tally" id="tt"></div>
    <div class="row"><button class="btn" id="tn">Neue Runde</button></div>`;
  const cells = [...st.querySelectorAll('.ttt button')];
  const winner = bb => { for (const l of LINES) if (bb[l[0]] && bb[l[0]] === bb[l[1]] && bb[l[0]] === bb[l[2]]) return l; return null; };
  const names = () => mode === 'cpu' ? { X: 'Du', O: 'Computer' } : { X: 'X', O: 'O' };
  function paint() {
    cells.forEach((c, i) => { c.textContent = b[i] === 'X' ? '×' : b[i] === 'O' ? '○' : ''; c.className = b[i] ? b[i].toLowerCase() : ''; });
    const n = names();
    $('#tt').innerHTML = `<div><b style="color:var(--coral)">${score.X}</b><span>${n.X}</span></div><div><b>${score.U}</b><span>Unentschieden</span></div><div><b style="color:var(--sun)">${score.O}</b><span>${n.O}</span></div>`;
  }
  function minimax(bb, p) {
    const w = winner(bb);

function mountSnake(st) {
  const N = 17, dpr = Math.min(window.devicePixelRatio || 1, 2);
  st.innerHTML = `<p class="status" id="ss" aria-live="polite">0 Äpfel</p>
    <div class="snk" id="sbox"><canvas id="sc"></canvas><div class="over" id="so"><b class="fd" style="font-size:28px">Schlange</b><span>Pfeiltasten, Wischen oder Steuerkreuz</span><button class="btn" id="sgo">Start</button></div></div>
    <div class="pad"><button class="u" data-d="0,-1" aria-label="Hoch">▲</button><button class="l" data-d="-1,0" aria-label="Links">◀</button><button class="d" data-d="0,1" aria-label="Runter">▼</button><button class="r" data-d="1,0" aria-label="Rechts">▶</button></div>`;
  const cv = $('#sc'), ctx = cv.getContext('2d');
  let cell = 20, snake, dir, queue, apple, score, running = false, iv, speed;
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

    cv.style.width = cv.style.height = px + 'px'; $('#sbox').style.width = px + 'px';
    cv.width = cv.height = px * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function placeApple() {
    do { apple = { x: rnd(N), y: rnd(N) }; } while (snake.some(s => s.x === apple.x && s.y === apple.y));
  }
  function reset() {
    snake = [{ x: 7, y: 8 }, { x: 6, y: 8 }, { x: 5, y: 8 }, { x: 5, y: 9 }, { x: 5, y: 10 }];
    dir = { x: 1, y: 0 }; queue = []; score = 0; speed = 150; apple = { x: 11, y: 8 };
    $('#ss').textContent = '0 Äpfel';
  }
  function draw() {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { ctx.fillStyle = (x + y) % 2 ? '#1d1a4a' : '#221f55'; ctx.fillRect(x * cell, y * cell, cell, cell); }
    const c = cell / 2;
    ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(apple.x * cell + c, apple.y * cell + c + 1, cell * 0.38, 0, 7); ctx.fill();
    ctx.fillStyle = '#3ddc97'; ctx.fillRect(apple.x * cell + c, apple.y * cell + 2, cell * 0.22, cell * 0.16);
    snake.forEach((s, i) => { ctx.fillStyle = i ? (i % 2 ? '#3ddc97' : '#35c98a') : '#2bb87b'; rr(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2, cell * 0.3); ctx.fill(); });
    const h = snake[0], ex = dir.y ? 0.22 : 0, ey = dir.x ? 0.22 : 0;
    ctx.fillStyle = D;
    for (const sgn of [-1, 1]) { ctx.beginPath(); ctx.arc(h.x * cell + c + dir.x * cell * 0.15 + sgn * ex * cell, h.y * cell + c + dir.y * cell * 0.15 + sgn * ey * cell, cell * 0.09 + 1, 0, 7); ctx.fill(); }
  }
  function step() {
    if (queue.length) dir = queue.shift();
    const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eat = h.x === apple.x && h.y === apple.y;
    const body = eat ? snake : snake.slice(0, -1);
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(s => s.x === h.x && s.y === h.y)) return end();
    snake.unshift(h);
    if (eat) {

      if (snake.length >= N * N) return end(); placeApple();

  }

  const ro = new ResizeObserver(size); ro.observe(st);
  return () => { clearInterval(iv); ro.disconnect(); };
}

      h.classList.add('hit'); upAt = -1; clearTimeout(hideT);
      setTimeout(() => h.classList.remove('up', 'hit'), 180);
      clearTimeout(tick); tick = setTimeout(pop, 250);
    }
  });
  return () => { clearInterval(iv); clearTimeout(tick); clearTimeout(hideT); };
}

// ---------- Start ----------
function start(data) {
  if (data && data.view && !location.hash) location.hash = data.view;
  route();
}
window.claude?.hot?.snapshot?.(() => ({ view: current }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
}
</script>
